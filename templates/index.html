<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Object Detection Tool</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; text-align: center; }
        .header { margin-bottom: 25px; }
        .header h1 { color: #1e88e5; margin-bottom: 5px; }
        .upload-section { margin-bottom: 20px; display: flex; justify-content: center; gap: 15px; align-items: center; }
        .btn { background-color: #2e7d32; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; }
        .btn:disabled { background-color: #9e9e9e; cursor: not-allowed; }
        .panels { display: flex; justify-content: center; gap: 20px; max-width: 1000px; margin: 0 auto; flex-wrap: wrap; }
        .panel { flex: 1; min-width: 300px; background: white; border: 2px solid #90caf9; border-radius: 12px; padding: 15px; min-height: 350px; display: flex; flex-direction: column; align-items: center; }
        .panel h2 { color: #1976d2; margin-top: 0; }
        .img-preview { max-width: 100%; max-height: 320px; border-radius: 8px; object-fit: contain; margin-top: 10px; display: none; }
        #status-msg { margin-top: 10px; font-weight: bold; color: #555; }
        .detections-box { width: 100%; margin-top: 15px; text-align: left; font-size: 14px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 AI Object Detection Tool</h1>
        <p>YOLOv8 + Flask + OpenCV</p>
    </div>

    <div class="upload-section">
        <input type="file" id="imageInput" accept="image/*">
        <button id="detectBtn" class="btn">🚀 Detect Objects</button>
    </div>

    <div id="status-msg"></div>

    <div class="panels">
        <div class="panel">
            <h2>Original Image</h2>
            <img id="originalImg" class="img-preview" alt="Original Image">
        </div>
        <div class="panel">
            <h2>Detection Results</h2>
            <img id="detectedImg" class="img-preview" alt="Detection Result">
            <div id="detectionsList" class="detections-box"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
